name: CI diag

on:
  pull_request:
    branches: [main]

jobs:
  ab:
    name: ${{ matrix.variant }} ${{ matrix.rep }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [before, after, after-nocov]
        rep: [1, 2, 3]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: securo_test
          POSTGRES_PASSWORD: securo_test
          POSTGRES_DB: securo_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U securo_test -d securo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.variant == 'before' && 'fix/ty-main' || 'perf/ci-postgres-template' }}
      - uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            backend/pyproject.toml
            backend/.python-version
      - run: uv sync --locked --all-extras
      - run: git log -1 --format=%H; lscpu | grep -E "Model name"
      - name: timed
        env:
          POSTGRES_TEST_URL: postgresql+asyncpg://securo_test:securo_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/securo_test
          COV: ${{ matrix.variant == 'after-nocov' && '-p no:cov' || '--cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=60' }}
        run: |
          pg_files=$(grep -l postgres_sessions tests/test_*.py)
          s=$(date +%s.%N); uv run --no-sync pytest -q -p no:cacheprovider $pg_files | tail -1; echo "RESULT pg_only_serial $(echo "$(date +%s.%N) - $s" | bc)"
          s=$(date +%s.%N); uv run --no-sync pytest -n auto --dist loadfile $COV -ra -W error | tail -1; echo "RESULT full_suite $(echo "$(date +%s.%N) - $s" | bc)"
